# Build release binaries when a version tag (v*) is pushed and attach them to
# a GitHub Release. Linux binaries are statically linked against musl, so they
# run on any distro with no dependencies. Asset names carry no version so
# `releases/latest/download/<asset>` is a stable install URL.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          asset="logtui-${{ matrix.target }}"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a "$asset.zip" "./target/${{ matrix.target }}/release/logtui.exe"
            echo "ASSET=$asset.zip" >> "$GITHUB_ENV"
          else
            tar czf "$asset.tar.gz" -C "target/${{ matrix.target }}/release" logtui
            echo "ASSET=$asset.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
