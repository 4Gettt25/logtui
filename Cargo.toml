[package]
name = "logtui"
version = "0.1.0"
edition = "2021"
description = "Pipe any command's output into an interactive TUI viewer with live fuzzy/regex filtering"
license = "MIT"
repository = "https://github.com/4Gettt25/logtui"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
fuzzy-matcher = "0.3"
regex = "1"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
