[package]
name = "logtui"
version = "0.1.0"
edition = "2021"
description = "Pipe any command's output into an interactive TUI viewer with live fuzzy/regex filtering"
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
fuzzy-matcher = "0.3"
regex = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
